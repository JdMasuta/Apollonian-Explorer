name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check engine (mypy --strict)
        run: |
          if [ -d core/engine ]; then mypy; fi
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Performance gate
        run: python benchmark.py

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Start backend
        run: |
          cd backend
          nohup python -m uvicorn main:app --port 8000 > /tmp/be.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s http://localhost:8000/health && break || sleep 1
          done
      - name: API-level end-to-end smoke
        run: python scripts/e2e_smoke.py
      - name: Backend log on failure
        if: failure()
        run: tail -50 /tmp/be.log

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build
