name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check engine (mypy --strict)
        run: |
          if [ -d core/engine ]; then mypy; fi
      # test_gasket_generator.py exercises the retired legacy SymPy generator
      # (kept as a cross-check oracle) and takes many minutes (ISSUES.md
      # Issue #5); it is excluded until the legacy module is removed.
      - name: Tests
        run: >
          python -m pytest tests/ -q
          --ignore=tests/test_gasket_generator.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build
